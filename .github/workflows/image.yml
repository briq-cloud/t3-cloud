name: T3 Cloud image

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked image after repository and package ownership are verified
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: t3-image-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  T3_IMAGE: ghcr.io/briq-cloud/t3-cloud

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Check runtime and release resolution
        run: |
          npm ci --omit=dev --ignore-scripts --no-fund --no-audit
          node --test --test-timeout=20000 ./*.test.mjs bin/resolve-gh-release.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve pinned inputs and immutable tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          codex_version="$(node -p 'require("./t3-source/source.json").codex')"
          claude_version="$(node -p 'require("./t3-source/source.json").claude')"
          node bin/resolve-gh-release.mjs openai/codex rust-v codex-package-x86_64-unknown-linux-musl.tar.gz "$codex_version" > /tmp/codex-release
          read -r codex codex_sha256 < /tmp/codex-release
          rm /tmp/codex-release
          base="ghcr.io/briq-cloud/sandbox@$(docker buildx imagetools inspect ghcr.io/briq-cloud/sandbox:latest --format '{{json .Manifest}}' | jq -r .digest)"
          tag="$(date -u +%Y-%m-%d)"
          if [ "${{ github.event_name }}" != pull_request ]; then
            n=1
            while docker buildx imagetools inspect "$T3_IMAGE:$tag" > /dev/null 2>&1; do n=$((n+1)); tag="$(date -u +%Y-%m-%d).$n"; done
          fi
          {
            echo "base=$base"
            echo "tag=$tag"
            echo "codex=$codex"
            echo "codex_sha256=$codex_sha256"
            echo "claude=$claude_version"
          } >> "$GITHUB_OUTPUT"
      - name: Build T3 Cloud
        uses: docker/build-push-action@v6
        with:
          context: .
          target: t3-cloud
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          build-args: |
            BASE=${{ steps.version.outputs.base }}
            CLAUDE_VERSION=${{ steps.version.outputs.claude }}
            CODEX_VERSION=${{ steps.version.outputs.codex }}
            CODEX_SHA256=${{ steps.version.outputs.codex_sha256 }}
            TTYD_VERSION=1.7.7
          tags: ${{ env.T3_IMAGE }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=t3-cloud
          cache-to: type=gha,mode=max,scope=t3-cloud
      # Empty central state initializes the actual pinned local app-server. Network isolation
      # excludes cloud allocation and login; this smoke does not qualify turns or recovery.
      - name: Offline central T3 startup smoke test
        run: |
          set -eu
          smoke_env="$(mktemp)"
          t3_smoke_id=
          trap 'if [ -n "$t3_smoke_id" ]; then docker rm -fv "$t3_smoke_id" > /dev/null 2>&1 || true; fi; rm -f "$smoke_env"' EXIT
          node --input-type=module - "$smoke_env" <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          writeFileSync(process.argv[2], [
            `T3_CLOUD_OWNER_KEY=${randomBytes(32).toString('base64url')}`,
            `T3_CLOUD_EDGE_TOKEN=${randomBytes(32).toString('base64url')}`,
            'T3_CLOUD_OWNER_ID=ci-smoke-owner',
            'T3_CLOUD_STATE=/work/.t3-cloud',
            'T3_CLOUD_PUBLIC_ORIGIN=https://t3-smoke.invalid',
            `T3_CLOUD_CHILD_IMAGE=ghcr.io/briq-cloud/t3-cloud@sha256:${'0'.repeat(64)}`,
            'BRIQ_API_URL=http://127.0.0.1:9',
            'BRIQ_MCP_URL=https://127.0.0.1:9/mcp',
            '',
          ].join('\n'), { mode: 0o600 });
          NODE
          # Generated credentials stay in the private env file; never print or inspect it.
          t3_smoke_id="$(docker run -d --network none --env-file "$smoke_env" --name t3-cloud-smoke "$T3_IMAGE:${{ steps.version.outputs.tag }}")"
          for _ in $(seq 1 30); do
            docker exec "$t3_smoke_id" node -e "fetch('http://127.0.0.1:8080/.well-known/t3/environment').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break
            sleep 1
          done
          docker exec "$t3_smoke_id" node -e "fetch('http://127.0.0.1:8080/.well-known/t3/environment').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker exec "$t3_smoke_id" node -e 'const assert=require("node:assert/strict");fetch("http://127.0.0.1:8080/_cloud/capabilities").then(async r=>{assert.equal(r.status,200);assert.deepEqual(await r.json(),{role:"central"})}).catch(()=>process.exit(1))'
          docker exec "$t3_smoke_id" sh -c 'test -x /bin/bash && test -d /work/.t3-cloud/central.lock && test ! -e /opt/agent-home-runner && test ! -e /opt/dsh && test ! -e /usr/local/bin/briq-agent-acp'
          docker exec "$t3_smoke_id" node -e 'const assert=require("node:assert/strict"),fs=require("node:fs"),cp=require("node:child_process"),version=require("/opt/t3/source.json").codex;assert.equal(cp.execFileSync("codex",["--version"],{encoding:"utf8"}).trim(),`codex-cli ${version}`);assert.equal(fs.readFileSync("/etc/t3-cloud/codex-version","utf8").trim(),version);assert.equal(cp.execFileSync("/opt/t3-cloud/bin/codex-remote",["--version"],{encoding:"utf8"}).trim(),`codex-cli ${version}`);assert.equal(process.versions.node,require("/opt/t3/source.json").node);assert.equal(require("/opt/t3-cloud/node_modules/ws/package.json").version,"8.22.0")'
          # Uses the actual image-pinned native CLIs, without credentials or model calls.
          # A second bootstrap must preserve the definitions accepted during native startup.
          docker exec "$t3_smoke_id" t3-cloud-start true
          docker exec "$t3_smoke_id" node -e 'const fs=require("node:fs"),assert=require("node:assert/strict");assert.match(fs.readFileSync("/work/.logins/codex/config.toml","utf8"),/bearer_token_env_var = "BRIQ_MCP_TOKEN"/);assert.equal(JSON.parse(fs.readFileSync("/work/.logins/claude/.claude.json","utf8")).mcpServers.briq.headers.Authorization,"Bearer \u0024{BRIQ_MCP_TOKEN}");assert.ok(fs.existsSync("/work/.t3/home/.agents/skills/briq/SKILL.md"));assert.ok(fs.existsSync("/work/.logins/claude/skills/briq/SKILL.md"))'

      # Reuses the fake-provider fixture and per-thread MCP builder with both pinned binaries.
      # No credentials or model network; this is not cloud/subscription qualification.
      - name: Offline pinned provider MCP image conformance
        run: |
          set -eu
          claude_probe_id=
          trap 'if [ -n "$claude_probe_id" ]; then docker rm -fv "$claude_probe_id" > /dev/null 2>&1 || true; fi' EXIT
          claude_probe_id="$(docker create --network none --cap-drop ALL --security-opt no-new-privileges --read-only --pids-limit 128 --memory 2g --tmpfs /tmp:rw,nosuid,nodev --workdir /tmp --env HOME=/tmp/home --env CLAUDE_CONFIG_DIR=/tmp/home/config --entrypoint /usr/local/bin/node "$T3_IMAGE:${{ steps.version.outputs.tag }}" /opt/t3-cloud/fixtures/claude-alias.mjs /usr/local/bin/claude /tmp/claude-image-result.json)"
          timeout --signal=TERM --kill-after=5s 155s docker start --attach "$claude_probe_id"
          test "$(docker inspect --format '{{.State.Status}}:{{.State.ExitCode}}' "$claude_probe_id")" = 'exited:0'

      - name: Publish checked image
        id: publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: |
          set -euo pipefail
          docker push "$T3_IMAGE:${{ steps.version.outputs.tag }}"
          docker tag "$T3_IMAGE:${{ steps.version.outputs.tag }}" "$T3_IMAGE:latest"
          docker push "$T3_IMAGE:latest"
          digest="$(docker buildx imagetools inspect "$T3_IMAGE:${{ steps.version.outputs.tag }}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest provenance
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.T3_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
